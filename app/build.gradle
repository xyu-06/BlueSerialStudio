plugins {
    id 'com.android.application'
}

android {
    namespace 'com.embedded.blueserial'
    compileSdk 35

    defaultConfig {
        applicationId 'com.embedded.blueserial'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '1.7.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
